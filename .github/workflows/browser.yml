name: Browser MCP Server

on:
  workflow_dispatch:

jobs:
  browser-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Max 6-hour session

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64

      - name: Start MCP Server + Tunnel
        run: |
          # Start the MCP server in the background
          python server.py &
          sleep 5

          # Launch a Cloudflare Tunnel to expose the local server
          ./cloudflared-linux-amd64 tunnel --url http://localhost:3001 2>&1 | tee tunnel.log &
          sleep 10

          # Print the tunnel URL for the MCP client to connect
          echo "============================================"
          echo "🔗 TUNNEL URL:"
          grep -o 'https://[^ ]*\.trycloudflare\.com' tunnel.log || echo "Waiting for tunnel..."
          echo "============================================"
          echo "Append /sse to the URL for MCP client configuration"
          echo "============================================"

          # Keep the runner alive (up to the 6-hour timeout)
          sleep 21000
